<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Roblox breakout tracker</title>
<style>
:root {
  color-scheme: light;
  --paper: #f7f6fb; --card: #ffffff; --line: #e6e3f1; --ink: #2a2740; --ink-2: #5d5a78; --ink-3: #8380a0;
  --iris: #6558d3; --up: #2e9e6e; --down: #d8645c;
  --mint: #d9f2e5; --lilac: #e4defa; --sky: #d9eafb; --peach: #ffe3d4; --butter: #fbf0c4;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #191824; --card: #22212f; --line: #36344a; --ink: #eceaf6; --ink-2: #b9b6d0; --ink-3: #8f8cab;
    --iris: #a298f2; --up: #58c596; --down: #ee8880;
    --mint: #1f4435; --lilac: #37315f; --sky: #223d57; --peach: #553628; --butter: #4a421f;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 76px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14.5px/1.5 var(--body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--iris); outline-offset: 2px; }

/* top bar: the ask bar is the one control that matters */
.top { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: auto minmax(220px, 1fr) auto; gap: 14px 20px; align-items: center; padding: 10px 22px; }
.brand { font: 650 18px/1.2 var(--round); letter-spacing: -.01em; }
.brand small { display: block; font: 400 12.5px/1.3 var(--body); color: var(--ink-2); letter-spacing: 0; }
.ask { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 2px 4px 2px 14px; }
.ask:focus-within { border-color: var(--iris); }
.ask input { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 0; outline: none; }
.ask input::placeholder { color: var(--ink-3); }
.ask button { border: 0; background: none; border-radius: 10px; padding: 7px 10px; cursor: pointer; color: var(--ink-2); }
.ask button:hover { background: var(--lilac); color: var(--ink); }
.ask button.live { background: var(--peach); color: var(--ink); }
.mode { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.mode button { border: 0; background: none; border-radius: 9px; padding: 6px 14px; cursor: pointer; color: var(--ink-2); }
.mode button[aria-pressed="true"] { background: var(--lilac); color: var(--ink); font-weight: 600; }
#said { grid-column: 1 / -1; margin: 0; color: var(--ink-2); font-size: 13px; }
#said:empty { display: none; }
#said b { color: var(--ink); font-weight: 600; }

main { padding: 18px 22px 60px; max-width: 1680px; margin: 0 auto; }
.banner { background: var(--peach); border-radius: 12px; padding: 9px 14px; margin-bottom: 14px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.box { grid-column: span 12; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: clip; }
.box.half { grid-column: span 6; }
@media (max-width: 980px) { .box.half { grid-column: span 12; } .top { grid-template-columns: 1fr auto; } .ask { grid-column: 1 / -1; grid-row: 2; } }
.box.dragging { opacity: .45; }
.box.over-before { box-shadow: 0 -4px 0 var(--iris); }
.box.over-after { box-shadow: 0 4px 0 var(--iris); }
.head { display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 16px; cursor: grab; user-select: none; }
.head:active { cursor: grabbing; }
.mint > .head { background: var(--mint); } .lilac > .head { background: var(--lilac); } .sky > .head { background: var(--sky); }
.peach > .head { background: var(--peach); } .butter > .head { background: var(--butter); }
.head h2 { font: 650 15.5px/1.3 var(--round); margin: 0; }
.head .hint { color: var(--ink-2); font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon { border: 0; background: none; border-radius: 9px; width: 30px; height: 30px; cursor: pointer; color: var(--ink-2); font-size: 17px; line-height: 1; }
.icon:hover { background: rgba(127, 127, 160, .18); color: var(--ink); }
.menu { position: absolute; z-index: 30; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 5px; min-width: 200px;
  box-shadow: 0 10px 30px rgba(42, 39, 64, .16); }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.menu button:hover { background: var(--lilac); }
.tools { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.tools input, .tools select { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 5px 9px; }
.tools input[type=search] { width: 200px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 5px 11px; cursor: pointer; color: var(--ink-2); }
.btn:hover { border-color: var(--iris); color: var(--ink); }
.cols { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--paper); }
.cols label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.scroll { overflow: auto; max-height: 560px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; vertical-align: middle; }
td.num, th.num { text-align: right; }
td.wrapcell { white-space: normal; min-width: 240px; max-width: 460px; color: var(--ink-2); }
thead th { position: sticky; top: 0; z-index: 1; background: var(--card); padding: 0; border-bottom: 1px solid var(--line); }
thead button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 8px 12px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
thead th.num button { text-align: right; }
thead button:hover, thead th[aria-sort] button { color: var(--ink); font-weight: 600; }
thead th[aria-sort="ascending"] button::after { content: " \25B4"; color: var(--iris); }
thead th[aria-sort="descending"] button::after { content: " \25BE"; color: var(--iris); }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover { background: var(--paper); }
tbody tr:last-child td { border-bottom: 0; }
a { color: inherit; }
td.game a { font-weight: 600; text-decoration: none; }
td.game a:hover { text-decoration: underline; text-decoration-color: var(--iris); }
.pill { display: inline-block; margin-left: 7px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--mint); }
.stage { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12.5px; }
.stage.early { background: var(--mint); } .stage.live { background: var(--sky); } .stage.crowded { background: var(--butter); } .stage.fading { background: var(--peach); }
.up::before { content: "\25B2\00A0"; font-size: 9px; color: var(--up); }
.down::before { content: "\25BC\00A0"; font-size: 9px; color: var(--down); }
tr.detail td { white-space: normal; background: var(--paper); font-size: 13.5px; }
tr.detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; margin: 4px 0 8px; max-width: 900px; }
tr.detail dt { color: var(--ink-3); } tr.detail dd { margin: 0; overflow-wrap: anywhere; }
tr.detail a { color: var(--iris); }
svg.spark { display: block; overflow: visible; }
svg.spark path { fill: none; stroke: var(--iris); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.spark circle { fill: var(--iris); stroke: var(--card); stroke-width: 2; }
.foot-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 16px; color: var(--ink-3); font-size: 12.5px; border-top: 1px solid var(--line); }
.empty { padding: 26px 16px; color: var(--ink-2); margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); }
.tile { background: var(--card); padding: 14px 16px; }
.tile .v { font: 650 28px/1.1 var(--round); font-variant-numeric: tabular-nums; }
.tile .l { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
.calltext { padding: 14px 16px; max-width: 78ch; margin: 0; }
.more { margin-top: 26px; }
.more > summary { cursor: pointer; font: 650 15.5px/1.3 var(--round); padding: 6px 0; }
.more > summary span { color: var(--ink-3); font: 400 13px var(--body); margin-left: 8px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 10px; }
.shelf .item { border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; background: var(--card); }
.shelf .item div { flex: 1; } .shelf .item b { display: block; font-family: var(--round); } .shelf .item span { color: var(--ink-2); font-size: 13px; }
.aibox { margin-top: 18px; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--card); max-width: 640px; }
.aibox label { display: block; font-size: 13px; color: var(--ink-2); margin: 8px 0 3px; }
.aibox input { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; background: var(--card); }
.aibox p { color: var(--ink-2); font-size: 13px; margin: 8px 0; }
.note { color: var(--ink-3); font-size: 12.5px; max-width: 90ch; margin-top: 26px; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--card); padding: 4px 9px; border-radius: 8px; font-size: 12.5px; z-index: 40; display: none; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .box { transition: box-shadow .12s; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 2px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 12px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--lilac); border-color: transparent; color: var(--ink); font-weight: 600; }

/* cute view: the same boxes as pastel posters with big rounded lettering. Always light, like the Telegram cards. */
html.cute { color-scheme: light;
  --paper: #f6f0fa; --card: #ffffff; --line: #e9e0f4; --ink: #2a2158; --ink-2: #5b4f8f; --ink-3: #8b80b5;
  --iris: #6a4fe0; --up: #17936a; --down: #dc4f6b;
  --mint: #c9eeda; --lilac: #e0d7fb; --sky: #cfe4ff; --peach: #ffd8c6; --butter: #fbecae;
  --cute: "Fredoka", ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Segoe UI", system-ui, sans-serif;
  --poster: "Lilita One", "Arial Rounded MT Bold", "Arial Black", "Segoe UI Black", system-ui, sans-serif; }
.cute body { font: 600 17px/1.45 var(--cute); }
.cute .top { background: rgba(246, 240, 250, .9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 0; padding: 14px 26px; }
.cute .brand, .cute .head h2, .cute .tile .v, .cute .more > summary { font-synthesis: none; }
.cute .brand { font: 800 27px/1.1 var(--poster); letter-spacing: .01em; }
.cute .brand small { font: 600 14px/1.4 var(--cute); }
.cute .ask { border-radius: 999px; border-width: 2px; padding: 4px 6px 4px 22px; }
.cute .ask input { padding: 10px 0; font-weight: 600; }
.cute .ask button { border-radius: 999px; padding: 9px 16px; font-weight: 700; }
.cute .mode { border-radius: 999px; border-width: 2px; padding: 4px; }
.cute .mode button { border-radius: 999px; padding: 8px 18px; font-weight: 700; }
.cute .mode button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.cute #said { font-size: 16px; }
.cute main { max-width: 1760px; padding: 26px 26px 80px; }
.cute .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 26px; }
.cute .box, .cute .box.half { grid-column: auto; border: 0; border-radius: 36px; padding: 30px 30px 22px; overflow: visible;
  --tint: var(--sky); --b1: #fddbe5; --b2: #d6e8fc; --b3: #fde2d2; --b4: #e9dcf6;
  background: radial-gradient(75% 55% at 0% 0%, var(--b1) 0, transparent 72%), radial-gradient(75% 55% at 100% 0%, var(--b2) 0, transparent 72%),
    radial-gradient(75% 55% at 0% 100%, var(--b3) 0, transparent 72%), radial-gradient(75% 55% at 100% 100%, var(--b4) 0, transparent 72%), #fbf4ee; }
.cute .box.wide { grid-column: 1 / -1; }
.cute .box.mint { --tint: var(--mint); --b2: #d2f1e1; } .cute .box.lilac { --tint: var(--lilac); --b2: #e3dbfb; --b1: #fbdcec; }
.cute .box.peach { --tint: var(--peach); --b2: #ffe2d2; --b1: #fdeac8; } .cute .box.butter { --tint: var(--butter); --b2: #fbf0c0; }
.cute .box > .head { padding: 0; background: none; align-items: flex-start; }
.cute .head h2 { flex: 1; font: 800 clamp(34px, 2.5vw, 46px)/1 var(--poster); text-transform: uppercase; letter-spacing: .01em; }
.cute .head .hint { display: none; }
.cute .icon { width: 42px; height: 42px; font-size: 22px; border-radius: 999px; background: rgba(255, 255, 255, .65); color: var(--ink); }
.cute .sub { margin: 12px 0 16px; font: 600 19px/1.35 var(--cute); color: var(--ink-2); }
.cute .chips { padding: 0; gap: 8px; margin: 0 0 16px; }
.cute .chip { border: 0; padding: 8px 18px; font: 700 17px/1.2 var(--cute); background: rgba(255, 255, 255, .78); color: var(--ink-2); }
.cute .chip[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 700; }
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.cardrow { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: center; min-height: 94px; overflow: hidden;
  background: #fff; border-radius: 26px; box-shadow: 0 5px 16px rgba(70, 50, 130, .10); cursor: pointer; }
.cardrow:hover { box-shadow: 0 7px 20px rgba(70, 50, 130, .17); }
.rank { align-self: stretch; display: grid; place-items: center; background: var(--tint); font: 700 26px/1 var(--cute); }
.what { padding: 13px 8px 13px 24px; min-width: 0; }
.what a { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font: 700 25px/1.15 var(--cute); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.what a:hover { text-decoration: underline; text-decoration-color: var(--iris); }
.meta { margin-top: 6px; font: 600 16.5px/1.4 var(--cute); color: var(--ink-2); }
.meta .gain { color: var(--up); } .meta .loss { color: var(--down); }
.meta .tag { display: inline-block; margin-right: 10px; padding: 0 11px; border-radius: 999px; background: var(--tint); color: var(--ink); }
.big { margin: 0 22px 0 10px; padding: 10px 18px; border-radius: 18px; background: var(--tint); font: 700 26px/1.1 var(--cute); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cdetail { background: rgba(255, 255, 255, .82); border-radius: 22px; padding: 14px 22px; font: 500 16px/1.5 var(--cute); }
.cdetail dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 18px; margin: 0 0 8px; }
.cdetail dt { color: var(--ink-3); } .cdetail dd { margin: 0; overflow-wrap: anywhere; }
.cdetail p { margin: 6px 0 0; } .cdetail a { color: var(--iris); font-weight: 700; }
.pfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; font: 600 14.5px/1.3 var(--cute); color: var(--ink-2); }
.pfoot button { border: 0; border-radius: 999px; padding: 9px 20px; background: #fff; font: 700 16px/1.2 var(--cute); color: var(--ink); cursor: pointer; box-shadow: 0 3px 10px rgba(70, 50, 130, .12); }
.cute .empty { padding: 14px 4px; font: 600 18px/1.4 var(--cute); }
.cute .tiles { background: none; gap: 12px; margin-top: 18px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.cute .tile { border-radius: 26px; padding: 20px 24px; box-shadow: 0 5px 16px rgba(70, 50, 130, .10); }
.cute .tile .v { font: 800 46px/1 var(--poster); }
.cute .tile .l { margin-top: 8px; font: 600 16px/1.35 var(--cute); }
.cute .calltext { max-width: none; margin: 18px 0 0; padding: 22px 26px; background: #fff; border-radius: 26px; font: 600 21px/1.45 var(--cute); box-shadow: 0 5px 16px rgba(70, 50, 130, .10); }
.cute .menu { border: 0; border-radius: 20px; padding: 8px; font: 600 16px/1.3 var(--cute); box-shadow: 0 12px 34px rgba(70, 50, 130, .24); }
.cute .menu button { border-radius: 12px; padding: 10px 14px; }
.cute .more > summary { font: 800 26px/1.2 var(--poster); }
.cute .more > summary span { font: 600 15px var(--cute); }
.cute .shelf { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.cute .shelf .item { border: 2px dashed #d7caee; border-radius: 24px; padding: 16px 18px; }
.cute .shelf .item b { font: 700 19px/1.2 var(--cute); } .cute .shelf .item span { font-size: 15px; }
.cute .btn { border-width: 2px; border-radius: 999px; padding: 8px 18px; font-weight: 700; }
.cute .aibox { border-radius: 24px; border-width: 2px; } .cute .aibox label, .cute .aibox p { font-size: 15px; }
.cute .note { font: 500 14.5px/1.5 var(--cute); }
.cute .banner { border-radius: 22px; padding: 14px 20px; font: 700 17px/1.4 var(--cute); }
@media (max-width: 560px) {
  .cute main { padding: 16px 12px 60px; } .cute .box, .cute .box.half { padding: 22px 16px 16px; border-radius: 28px; }
  .cute .tiles { grid-template-columns: 1fr 1fr; } .cute .tile { padding: 14px 16px; } .cute .tile .v { font-size: 36px; } .cute .tile .l { font-size: 14px; }
  .cardrow { grid-template-columns: 44px minmax(0, 1fr) auto; } .what { padding-left: 14px; } .what a { font-size: 20px; }
  .meta { font-size: 14.5px; } .big { margin-right: 12px; padding: 7px 12px; font-size: 20px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Roblox breakout tracker<small id="updated"></small></div>
  <form class="ask" id="askform" role="search">
    <input id="ask" type="text" autocomplete="off" aria-label="Tell the page what you want to see"
      placeholder="Tell it what you want, for example: only fresh games and waves">
    <button type="button" id="mic" title="Speak instead of typing" hidden>Speak</button>
    <button type="submit" title="Apply">Go</button>
  </form>
  <div class="mode" role="group" aria-label="View">
    <button type="button" id="m-simple">Simple</button><button type="button" id="m-full">Full</button><button type="button" id="m-cute">Cute</button>
  </div>
  <p id="said" aria-live="polite"></p>
</header>
<main>
  <div id="banner"></div>
  <div class="grid" id="grid"></div>
  <details class="more" id="more">
    <summary>More boxes<span id="morecount"></span></summary>
    <div class="shelf" id="shelf"></div>
    <div class="aibox" id="aibox"></div>
  </details>
  <p class="note" id="note"></p>

      else if (a['do'] === 'dropcol' && b && a.col) { s.cols = colsFor(b).map(function (c) { return c.id; }).filter(function (c) { return c !== a.col; }); s.custom = true; notes.push('Removed a column from ' + B[b].title); }

        if (a.minP != null) { s.minP = a.minP; } if (a.maxAge != null) { s.maxAge = a.maxAge; } if (a.q != null) { s.q = a.q; }
        if (o.indexOf(b) < 0) { o.push(b); }
        notes.push('Filtered ' + B[b].title);
      }
      else if (a['do'] === 'sort' && b && a.key) { s.sort = [a.key, a.dir === 1 ? 1 : -1]; notes.push('Sorted ' + B[b].title); }
    });
    render();
    return notes;
  }

  // ---------- understanding a typed or spoken request without any AI ----------
  function boxesIn(t) {
    var hits = [];
    IDS.forEach(function (id) {
      var at = -1;
      [B[id].title.toLowerCase()].concat(B[id].words).forEach(function (w) { var i = t.indexOf(w); if (i >= 0 && (at < 0 || i < at)) { at = i; } });
      if (at >= 0) { hits.push([at, id]); }
    });
    hits.sort(function (a, b) { return a[0] - b[0]; });
    return hits.map(function (h) { return h[1]; });
  }
  function colIn(t, kind) {
    var reg = kind === 'waves' ? WC : kind === 'lanes' ? LC : C, best = null, len = 0;
    Object.keys(reg).forEach(function (k) {
      [reg[k].label.toLowerCase()].concat(reg[k].words || []).forEach(function (w) { if (w && t.indexOf(w) >= 0 && w.length > len) { best = k; len = w.length; } });
    });
    return best;
  }
  function understand(text) {
    var out = [];
    text.toLowerCase().split(/\s*(?:;|\.\s|, then | then | and then )\s*/).forEach(function (t) {
      t = t.trim().replace(/[.!?]+$/, ''); if (!t) { return; }
      var bx = boxesIn(t), tableBoxes = order().filter(function (id) { return B[id].kind === 'games'; }), m, o;
      if (/\b(reset|start over|start again|default layout|undo everything)\b/.test(t)) { out.push({ 'do': 'reset' }); return; }
      if (/\bsimple\b/.test(t) && !bx.length) { out.push({ 'do': 'mode', mode: 'simple' }); return; }
      if (/\b(cute|pastel|kawaii|poster|posters|cards|card view|big(ger)? (letters|text|font)|large (letters|text|font))\b/.test(t) && !bx.length) { out.push({ 'do': 'mode', mode: 'cute' }); return; }
      if (/\b(full view|full mode|advanced|all (the )?buttons|show everything|everything)\b/.test(t) && !bx.length) { out.push({ 'do': 'mode', mode: 'full' }); return; }
      if (/\b(move|put|place|drag|bring)\b/.test(t) && bx.length) {
        o = order().filter(function (x) { return x !== bx[0]; });
        if (bx[1] && /\b(above|before|over|on top of)\b/.test(t)) { out.push({ 'do': 'move', box: bx[0], to: Math.max(0, o.indexOf(bx[1])) }); return; }
        if (bx[1] && /\b(below|after|under|underneath|beneath)\b/.test(t)) { out.push({ 'do': 'move', box: bx[0], to: o.indexOf(bx[1]) + 1 }); return; }
        if (/\b(top|first|start|beginning)\b/.test(t)) { out.push({ 'do': 'move', box: bx[0], to: 0 }); return; }
        if (/\b(bottom|last|end)\b/.test(t)) { out.push({ 'do': 'move', box: bx[0], to: o.length }); return; }
      }
      if (/\b(half|narrow|side by side|smaller)\b/.test(t) && bx.length) { bx.forEach(function (b) { out.push({ 'do': 'width', box: b, w: 'half' }); }); return; }
      if (/\b(full width|wide|wider|bigger|larger)\b/.test(t) && bx.length) { bx.forEach(function (b) { out.push({ 'do': 'width', box: b, w: 'full' }); }); return; }
      if (/\bsort\b|\border by\b/.test(t)) {
        var sb = bx[0] || tableBoxes[0], rest = t.replace(/sort|order by/g, ' ');
        if (sb) { [B[sb].title.toLowerCase()].concat(B[sb].words).forEach(function (w) { rest = rest.replace(w, ' '); }); }
        var col = sb ? colIn(rest, B[sb].kind) : null;
        if (sb && col) { out.push({ 'do': 'sort', box: sb, key: regFor(sb)[col].key, dir: /\b(asc|ascending|lowest|smallest|newest|youngest|least)\b/.test(t) ? 1 : -1 }); return; }
      }
      var f = {}, any = false;
      if ((m = t.match(/(?:last|past|under|within|younger than|less than)\s+(\d+)\s*(hour|day|week)/))) { f.maxAge = m[2] === 'hour' ? Math.max(1, Math.ceil(m[1] / 24)) : m[2] === 'week' ? m[1] * 7 : Number(m[1]); any = true; }
      else if (/\b(today|24 ?h|24 hours)\b/.test(t)) { f.maxAge = 1; any = true; }
      if ((m = t.match(/(?:at least|over|above|more than|minimum|min)\s*(\d[\d,.]*)\s*(k)?/)) || (m = t.match(/(\d[\d,.]*)\s*(k)?\s*\+/))) {
        f.minP = Math.round(parseFloat(m[1].replace(/,/g, '')) * (m[2] ? 1000 : 1)); any = true;
      }
      if ((m = t.match(/\b(?:search|find|look for)\s+(?:for\s+)?(.+)$/))) { out.push({ 'do': 'filter', box: 'all', q: m[1].trim() }); return; }
      if (any) {
        (bx.length ? bx : (tableBoxes.length ? tableBoxes.slice(0, 1) : ['fresh'])).forEach(function (b) { if (B[b].kind === 'games') { out.push({ 'do': 'filter', box: b, minP: f.minP, maxAge: f.maxAge }); } });
        return;
      }
      var hide = /\b(hide|remove|delete|close|drop|get rid of|no more|without)\b/.test(t);
      var show = /\b(show|add|bring back|open|unhide|include|display|give me|i want|i need|i care)\b/.test(t);
      var only = /\b(only|just)\b/.test(t) || /^(i want|i need|i care about|give me)\b/.test(t);
      if (bx.length) {
        if (hide) { bx.forEach(function (b) { out.push({ 'do': 'hide', box: b }); }); }
        else if (only) { out.push({ 'do': 'only', boxes: bx }); }
        else { bx.forEach(function (b) { out.push({ 'do': 'show', box: b }); }); }
        return;
      }
      var c = colIn(t, 'games');
      if (c && (hide || show)) { tableBoxes.forEach(function (b) { out.push({ 'do': hide ? 'dropcol' : 'addcol', box: b, col: c }); }); }
    });
    return out;
  }

  // ---------- optional AI: any chat-completions style address, key kept in this browser ----------
  function aiSettings() { try { return JSON.parse(localStorage.getItem(AIKEY) || 'null'); } catch (e) { return null; } }
  function askAI(text, cfg) {
    var schema = { boxes: IDS.map(function (id) { return { id: id, title: B[id].title, about: B[id].about, kind: B[id].kind }; }),
      game_columns: ALLCOLS.map(function (k) { return { id: k, label: C[k].label, sort_key: C[k].key }; }), wave_columns: ALLW, lane_columns: ALLL,
      now: { mode: S.mode, showing: order(), hidden: IDS.filter(function (id) { return order().indexOf(id) < 0; }) } };
    var sys = 'You rearrange a dashboard made of boxes. Reply with JSON only: {"actions":[...],"reply":"one short sentence"}. ' +
      'Allowed actions: {"do":"mode","mode":"simple|full|cute"}, {"do":"only","boxes":[ids]}, {"do":"show","box":id}, {"do":"hide","box":id}, ' +
      '{"do":"order","boxes":[ids in display order]}, {"do":"move","box":id,"to":index}, {"do":"width","box":id,"w":"half|full"}, ' +
      '{"do":"cols","box":id,"cols":[column ids]}, {"do":"filter","box":id,"minP":number,"maxAge":days,"q":"text"}, ' +
      '{"do":"sort","box":id,"key":sort_key,"dir":1 or -1}, {"do":"reset"}. Boxes not shown stay available under More boxes. Dashboard: ' + JSON.stringify(schema);
    return fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
      body: JSON.stringify({ model: cfg.model, temperature: 0, messages: [{ role: 'system', content: sys }, { role: 'user', content: text }] }) })
      .then(function (r) { if (!r.ok) { throw new Error('the AI service answered ' + r.status); } return r.json(); })
      .then(function (j) {
        var c = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
        return JSON.parse(c.slice(c.indexOf('{'), c.lastIndexOf('}') + 1));
      });
  }
  function say(text, bold) { var p = $('said'); p.textContent = ''; if (bold) { p.appendChild(el('b', null, bold + ' ')); } p.appendChild(document.createTextNode(text)); }
  function request(text) {
    text = (text || '').trim(); if (!text) { return; }
    var cfg = aiSettings();
    var local = function () {
      var actions = understand(text);
      if (!actions.length) { say('Try "only fresh games and waves", "hide key numbers", "move waves to the top", "fresh games from the last 3 days", or "reset".', "I didn't catch that."); return; }
      say(act(actions).join('. ') + '.', 'Done.');
    };
    if (cfg && cfg.key && cfg.url && cfg.model) {
      say('Asking the AI you connected.');
      askAI(text, cfg).then(function (out) { var notes = act(out.actions || []); say(out.reply || (notes.join('. ') + '.'), 'Done.'); })
        .catch(function (e) { local(); say($('said').textContent + ' The connected AI could not be used (' + e.message + '), so the built-in commands handled this.'); });
    } else { local(); }
  }
  $('askform').addEventListener('submit', function (e) { e.preventDefault(); request($('ask').value); $('ask').value = ''; });
  $('m-simple').addEventListener('click', function () { say(act([{ 'do': 'mode', mode: 'simple' }]).join('. ') + '.', 'Done.'); });
  $('m-full').addEventListener('click', function () { say(act([{ 'do': 'mode', mode: 'full' }]).join('. ') + '.', 'Done.'); });
  $('m-cute').addEventListener('click', function () { say(act([{ 'do': 'mode', mode: 'cute' }]).join('. ') + '.', 'Done.'); });

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    var mic = $('mic'), rec = null; mic.hidden = false;
    mic.addEventListener('click', function () {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.interimResults = false;
      mic.classList.add('live'); mic.textContent = 'Listening';
      rec.onresult = function (e) { request(e.results[0][0].transcript); };
      rec.onerror = function () { say('The microphone was not available. Type the request instead.'); };
      rec.onend = function () { rec = null; mic.classList.remove('live'); mic.textContent = 'Speak'; };
      rec.start();
    });
  }

  function aiPanel() {
    var box = $('aibox'), cfg = aiSettings() || { url: 'https://api.x.ai/v1/chat/completions', model: '', key: '' };
    box.textContent = '';
    box.appendChild(el('b', null, cfg.key ? 'An AI is connected' : 'Connect an AI (optional)'));
    box.appendChild(el('p', null, 'Typed and spoken requests already work without it. Connecting your own AI key lets it handle free-form requests. The key stays in this browser and is sent only to the address below.'));
    var f = function (label, type, val, ph) { box.appendChild(el('label', null, label)); var i = el('input', { type: type, value: val, placeholder: ph, autocomplete: 'off' }); box.appendChild(i); return i; };
    var url = f('Address (chat completions)', 'url', cfg.url), model = f('Model name', 'text', cfg.model, 'the model name from your AI provider'), key = f('API key', 'password', cfg.key);
    var row = el('p'), sv = el('button', { type: 'button', 'class': 'btn' }, 'Save'), rm = el('button', { type: 'button', 'class': 'btn', style: 'margin-left:8px' }, 'Disconnect');
    sv.addEventListener('click', function () { try { localStorage.setItem(AIKEY, JSON.stringify({ url: url.value.trim(), model: model.value.trim(), key: key.value.trim() })); } catch (e) { /* ignore */ } aiPanel(); say('AI settings saved in this browser.'); });
    rm.addEventListener('click', function () { try { localStorage.removeItem(AIKEY); } catch (e) { /* ignore */ } aiPanel(); say('AI disconnected. Built-in commands still work.'); });
    row.appendChild(sv); if (cfg.key) { row.appendChild(rm); } box.appendChild(row);
  }

  // ---------- header and notes ----------
  $('updated').textContent = 'Updated ' + new Date(M.generated).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) +
    ', ' + M.history_days + ' day' + (M.history_days === 1 ? '' : 's') + ' of history';
  if (M.banner) { $('banner').appendChild(el('div', { 'class': 'banner' }, M.banner)); }
  $('note').textContent = 'Drag a box by its coloured bar to move it, or use its options button. Player counts are single readings taken twice a day, so they move with the hour; changes compare the same hour on an earlier day. ' +
    'Payout figures are rough estimates (visits a day x average playtime x $' + M.payout_per_hour + ' per player-hour); * marks an assumed ' + M.default_playtime + '-minute session. ' +
    'Age counts from the date a game was created on Roblox, which can be earlier than its public launch. Your layout is saved in this browser only.';
  aiPanel();
  render();
  window.__tracker = { act: act, understand: understand, request: request, state: function () { return S; } };
})();
</script>
