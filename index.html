<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox tracker</title>
<style>
  :root { --paper:#f7f6fb; --card:#fff; --line:#e6e3f1; --ink:#2a2740; --soft:#6c6888; --iris:#6558d3; --lilac:#e4defa; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#17152a; --card:#211e38; --line:#35315a; --ink:#eceaf8; --soft:#a9a5c8; --iris:#a79df2; --lilac:#2e2a52; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink);
         font-family:ui-rounded, "SF Pro Rounded", system-ui, "Segoe UI", sans-serif; }
  main { max-width:30rem; margin:1.5rem; padding:2rem 2.25rem; background:var(--card); border:1px solid var(--line); border-radius:18px; }
  h1 { margin:0 0 .5rem; font-size:1.5rem; }
  p { margin:.5rem 0; line-height:1.55; color:var(--soft); }
  .tag { display:inline-block; margin-bottom:1rem; padding:.25rem .7rem; border-radius:999px; background:var(--lilac); color:var(--iris); font-size:.85rem; font-weight:600; }
</style>
</head>
<body>
<main>
  <span class="tag">Waiting for the first update</span>
  <h1>Roblox tracker</h1>
  <p>No data has been published here yet.</p>
  <p>Once the tracker starts running, this page fills in with new and fast-rising Roblox games and refreshes twice a day.</p>
</main>
</body>
</html>
